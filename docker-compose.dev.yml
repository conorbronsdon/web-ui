# Plain-Docker dev environment for web-ui (issue #516).
#
# One service, one container, running BOTH the webpack dev server and the
# Express API server.
#
# Why one container and not two: webpack.config.js's devServer proxies the
# browser-facing routes -- `/`, `/api`, `/namespace`, `/podcast` -- to
# `http://localhost:5001` (the Express API server). That target is hardcoded
# to `localhost`. If the dev server and the API server run in two separate
# containers, they sit in two separate network namespaces, so `localhost:5001`
# inside the dev-server container reaches nothing -- the page (`/`) and every
# `/api/*` call fail through the proxy with a 502/504. Running both processes
# in a single container keeps them on one shared loopback, so the proxy target
# resolves. This is the same shape as the merged #586 devcontainer, which also
# runs both processes on one localhost.
#
# The API server is started in the background and the webpack dev server in the
# foreground (PID 1). `yarn install` runs once, before either server starts, so
# there is no concurrent write into the shared node_modules volume.
services:
  web-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: ["sh", "/usr/src/app/docker/entrypoint.sh"]
    command: ["sh", "-c", "yarn install && { yarn run start & } && yarn run dev:docker"]
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - web-ui-node-modules:/usr/src/app/node_modules
    ports:
      # 9001 = webpack dev server (UI, the address you actually open).
      # 5001 = Express API server. Published for parity with the README /
      # issue #516 ask and so the API can be hit directly; the UI itself
      # reaches it internally over localhost:5001 via the dev-server proxy.
      - "9001:9001"
      - "5001:5001"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

volumes:
  web-ui-node-modules:
